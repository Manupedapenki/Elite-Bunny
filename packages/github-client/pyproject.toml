[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[project]
name = "pr-intelligence-github-client"
version = "0.1.0"
description = "Shared GitHub API client for PR Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0,<1.0",
    "PyJWT[crypto]>=2.8.0,<3.0",
    "cryptography>=42.0",
    "structlog>=24.0",
    "redis>=5.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]