[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-service"
version = "0.1.0"
description = "LLM service — Claude API wrapper with prompt management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pr-intelligence-common",
    "anthropic>=0.39.0",
    "google-generativeai>=0.4.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
